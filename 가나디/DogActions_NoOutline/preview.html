<!doctype html><meta charset="utf-8"><title>강아지 동작 미리보기</title><style>body{background:#203e48;color:#f1edce;font-family:system-ui;padding:24px}main{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}section{background:#37545b;padding:20px;border-radius:12px}a{color:#ffad98}.sprite{width:128px;height:128px;image-rendering:pixelated;transform:scale(2);transform-origin:top left;margin-bottom:128px;animation-name:play;animation-timing-function:steps(var(--frames));animation-fill-mode:none}@keyframes play{to{background-position:var(--end) 0}}</style><h1>강아지 6가지 동작</h1><p>128×128 프레임 · 오른쪽 방향 · 투명 PNG. 한 번 재생 동작은 새로고침으로 다시 볼 수 있어요.</p><main><section><h2>걷기</h2><div class="sprite" style="background-image:url(Sheets/walk.png);--frames:6;--end:-768px;animation-duration:0.75s;animation-iteration-count:infinite"></div><p>6프레임 · 8 FPS · 반복</p><a href="Sheets/walk.png">시트 PNG</a></section><section><h2>위로 뛰어오르기</h2><div class="sprite" style="background-image:url(Sheets/jump.png);--frames:4;--end:-512px;animation-duration:0.5s;animation-iteration-count:1"></div><p>4프레임 · 8 FPS · 한 번 재생</p><a href="Sheets/jump.png">시트 PNG</a></section><section><h2>엎드리기</h2><div class="sprite" style="background-image:url(Sheets/lie_down.png);--frames:4;--end:-512px;animation-duration:0.6666666666666666s;animation-iteration-count:1"></div><p>4프레임 · 6 FPS · 한 번 재생</p><a href="Sheets/lie_down.png">시트 PNG</a></section><section><h2>앉기</h2><div class="sprite" style="background-image:url(Sheets/sit.png);--frames:4;--end:-512px;animation-duration:0.6666666666666666s;animation-iteration-count:1"></div><p>4프레임 · 6 FPS · 한 번 재생</p><a href="Sheets/sit.png">시트 PNG</a></section><section><h2>물기</h2><div class="sprite" style="background-image:url(Sheets/bite.png);--frames:4;--end:-512px;animation-duration:0.5s;animation-iteration-count:1"></div><p>4프레임 · 8 FPS · 한 번 재생</p><a href="Sheets/bite.png">시트 PNG</a></section><section><h2>물고 당기기</h2><div class="sprite" style="background-image:url(Sheets/bite_pull.png);--frames:4;--end:-512px;animation-duration:0.6666666666666666s;animation-iteration-count:infinite"></div><p>4프레임 · 6 FPS · 반복</p><a href="Sheets/bite_pull.png">시트 PNG</a></section></main>
